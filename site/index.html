<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RG Music Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one centred column, pill tabs on top; every apparatus keeps one colour across all views.
   One light look on purpose (direction D chosen by the owner); every colour is still set explicitly. */
:root { color-scheme: light;
  --bg: #FFFFFF; --fg: #1A1B1E; --muted: #5F6168; --line: #E3E4E8; --soft: #F1F2F4; --field: #F6F7F9;
  --ink: #1A1B1E; --on-ink: #FFFFFF; --link: #2F5BEA;
  --hoop: #2F5BEA; --ball: #E8833A; --clubs: #0E9F8E; --ribbon: #B24BD6; --rope: #8A8D96; --gala: #1A1B1E;
  --font: 'Manrope', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
}
/* Always keep room for the scrollbar: a longer Russian page must not shift the centred column sideways */
html { overflow-y: scroll; scrollbar-gutter: stable; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.45; }
a { color: inherit; text-decoration: none; }
a:hover { color: var(--link); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.wrap { max-width: 1200px; margin: 0 auto; padding-inline: 24px; padding-block: 0 64px; }
@media (max-width: 600px) { .wrap { padding-inline: 16px; } }
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; min-height: 76px; }
.logo { font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; background: var(--soft); border-radius: 24px; padding: 4px; }
.tab { font-size: 14px; font-weight: 600; min-height: 40px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 20px; color: var(--fg); }
.tab[aria-current="page"] { background: var(--ink); color: var(--on-ink); }
.lang { margin-left: auto; display: flex; background: var(--soft); border-radius: 22px; padding: 4px; }
.lang button { font: inherit; font-size: 13px; font-weight: 700; min-height: 36px; min-width: 44px; border: 0; border-radius: 18px; cursor: pointer; background: transparent; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--bg); color: var(--fg); }
h1 { font-size: clamp(34px, 5vw, 52px); font-weight: 800; letter-spacing: -.03em; line-height: 1.05; margin: 28px 0 8px; text-wrap: balance; }
h2 { font-size: 16px; font-weight: 700; margin: 0 0 12px; }
.muted { color: var(--muted); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.small { font-size: 13px; }
.sub { margin: 0 0 20px; color: var(--muted); }
.panel { border: 1px solid var(--line); border-radius: 16px; padding: 22px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 16px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); margin-block: 20px; }
.kpi b { display: block; font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; }
.search { width: 100%; box-sizing: border-box; font: inherit; font-size: 17px; min-height: 52px; padding: 0 20px; border: 1px solid var(--line); border-radius: 26px; background: var(--field); color: var(--fg); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-block: 16px 20px; }
.filters .search { flex: 1 1 260px; width: auto; min-height: 44px; font-size: 15px; }
.both { display: inline-grid; }
.both > span { grid-area: 1 / 1; text-align: center; }
.both > .ghost { visibility: hidden; }
/* Fixed widths: a native select grows to its longest option, and Russian country names are longer */
select.pill { width: 12.5em; flex: none; max-width: 100%; }
#c-gyms { width: 15em; }
select.period { width: 15em; }
.pill, select.pill { font: inherit; font-size: 14px; min-height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.bar { display: flex; gap: 3px; height: 8px; }
.bar span { border-radius: 4px; }
.card { display: block; border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; min-width: 0; }
.card:hover { border-color: var(--muted); color: inherit; }
.card .t { font-weight: 700; font-size: 16px; }
.plink { text-decoration: underline dotted; text-underline-offset: 3px; }
.yt { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--link); margin-top: 10px; min-height: 28px; }
.yt:hover { text-decoration: underline; }
.badge { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 10px; background: var(--soft); white-space: nowrap; }
.list-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.rank { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.meter { display: block; height: 4px; border-radius: 2px; background: var(--ink); margin-top: 6px; }
.num { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 10px 8px 10px 0; }
td { padding: 11px 8px 11px 0; border-top: 1px solid var(--line); vertical-align: top; }
.scroll { overflow-x: auto; }
.season h3 { font-size: 22px; font-weight: 800; margin: 28px 0 12px; }
.about { max-width: 760px; }
.about h2 { font-size: 20px; margin: 32px 0 10px; }
.about p, .about li { max-width: 68ch; }
.about ol, .about ul { padding-left: 1.3em; display: grid; gap: 8px; }
.about td:first-child { font-weight: 700; white-space: nowrap; }
.about a { text-decoration: underline; }
.routine { border-top-width: 4px; }
.app-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.timeline { display: grid; align-items: end; height: 110px; border-bottom: 1px solid var(--fg); min-width: 640px; }
.timeline div { display: flex; flex-direction: column-reverse; align-items: center; gap: 3px; padding-bottom: 6px; }
.timeline span { width: 11px; height: 11px; border-radius: 50%; }
.years { display: grid; min-width: 640px; margin-top: 6px; }
.years span { font-size: 11px; text-align: center; color: var(--muted); }
.chart { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 8px; align-items: end; height: 220px; }
.chart div { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; font-size: 12px; font-weight: 700; }
.chart i { width: 100%; border-radius: 6px 6px 0 0; background: var(--ink); margin-top: 4px; }
.chart-x { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 8px; margin-top: 6px; font-size: 10px; text-align: center; color: var(--muted); }
.results { display: grid; gap: 4px; margin-top: 10px; }
.results a { padding: 8px 12px; border-radius: 10px; background: var(--soft); }
.more { margin-top: 16px; }
footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 24px; }
footer a { text-decoration: underline; }
@media (prefers-reduced-motion: no-preference) { .card, .pill { transition: border-color .15s, background .15s; } }
</style>

      <p>Это любительский проект от большой фанатки художественной гимнастики, который отражает не только её любовь к этому виду спорта, но и к цифрам, статистике и рейтингам.</p>
      <p>Он отвечает на два вопроса: под какую музыку выступала гимнастка — по сезонам и предметам. И наоборот: для каждого когда-либо использованного в спорте музыкального произведения можно посмотреть, кто его выбирал, в каком году и под какой предмет.</p>
      <p>Сейчас в каталоге ${n.gyms} гимнасток с чемпионатов мира (${wc0}–${wc1}) и континентальных чемпионатов (с ${c0} года), у ${n.withMusic} из них известна музыка: ${n.routines} программ ${y0}–${y1} годов, ${n.works} произведений и ${n.versions} версий в исполнении разных музыкантов.</p>
      <h2>Как он сделан</h2>
      <ol>
        <li><b>Гимнастки.</b> Все участницы индивидуальных соревнований чемпионатов мира с ${wc0} года и взрослых чемпионатов Европы, Азии, Африки и Панамерики, по таблицам Википедии. У большинства континентальных чемпионатов в Википедии есть только таблица призёров: тогда в каталоге — призёры, а у гимнастки в списке чемпионатов видны только те, где она завоевала медаль. Если имя записано по-разному, берётся написание из профиля спортсменки на сайте World Gymnastics.</li>
        <li><b>Музыка.</b> Таблицы «Год / Предмет / Музыка» из статей о гимнастках в английской Википедии. Для испанских гимнасток добавлены таблицы из испанской Википедии: они переведены на английский и проверены вручную. Английская статья остаётся главной, другие только дополняют её.</li>
        <li><b>Произведения и версии.</b> Одна и та же музыка записана в статьях по-разному. Треки собираются в произведения; одинаковое название с разными авторами остаётся раздельным, пока нет доказательства, что это одно произведение (MusicBrainz или ручная проверка). Исполнитель указан так, как в источнике.</li>
        <li><b>Ручная проверка.</b> Спорные случаи — одинаковые названия у разных песен, расхождения между источниками, переводы — проверены вручную, решения хранятся отдельно от исходных данных.</li>
      </ol>
      <h2>Источники данных</h2>
      ${srcTable}
      <h2>Благодарности</h2>
      <p>Спасибо редакторам Википедии на английском, испанском и русском, которые годами ведут статьи о гимнастках и их музыке, и участникам MusicBrainz.</p>
      <p>Спасибо всем фанатам гимнастики из чата RG Pirates, которые поддержали моё начинание.</p>
      <p>В планах — архив музыки с форума rgforum.no. Когда он будет подключён, здесь появится благодарность людям, которые его собирали.</p>
      <h2>Обратная связь</h2>
      <p>Нашли ошибку, знаете музыку, которой нет в каталоге, или есть идея для сайта? Напишите в форме — аккаунт не нужен. Форма на английском, но отвечать можно по-русски.</p>
      <p><a class="pill" style="text-decoration:none" href="${FEEDBACK_URL}" target="_blank" rel="noopener">Оставить отзыв</a></p>
      <h2>Код</h2>
      <p>Исходный код открыт на ${repo}. Если у вас есть аккаунт GitHub, ошибку можно описать и в разделе Issues.</p>
      <p class="muted">${supportHtml()}</p>
    </div>` : `<div class="about">
      <h1>About</h1>
      <p class="sub">A catalogue of the music rhythmic gymnasts perform to.</p>
      <p>This is an amateur project by a big fan of rhythmic gymnastics. It reflects her love not only for the sport but also for numbers, statistics and rankings.</p>
      <p>It answers two questions: what a gymnast performed to, by season and apparatus. And the other way round: for every piece of music ever used in the sport, you can see who chose it, in which year and for which apparatus.</p>
      <p>The catalogue holds ${n.gyms} gymnasts from the World Championships (${wc0}–${wc1}) and the continental championships (since ${c0}). Music is known for ${n.withMusic} of them: ${n.routines} routines from ${y0}–${y1}, ${n.works} works and ${n.versions} versions by different performers.</p>
      <h2>How it is made</h2>
      <ol>
        <li><b>Gymnasts.</b> Everyone in the individual events of the World Championships since ${wc0} and of the senior European, Asian, African and Pan American Championships, from the Wikipedia result tables. For most continental championships Wikipedia has only the medal table: then the catalogue holds the medallists, and a gymnast’s list of championships shows only those where she won a medal. When a name is spelled in different ways, the spelling of the athlete’s World Gymnastics profile is used.</li>
        <li><b>Music.</b> The “Year / Apparatus / Music” tables in gymnasts’ English Wikipedia articles. For Spanish gymnasts, the tables of the Spanish Wikipedia are added, translated into English and checked by hand. The English article stays the main source; the others only fill its gaps.</li>
        <li><b>Works and versions.</b> The same music is written down in many ways. Tracks are grouped into works; one title with different authors stays split until there is evidence that it is one work (MusicBrainz or a manual check). The performer is shown as the source gives it.</li>
        <li><b>Manual review.</b> Doubtful cases, such as one title for different songs, conflicts between sources and translations, are checked by hand, and the decisions are kept apart from the source data.</li>
      </ol>
      <h2>Data sources</h2>
      ${srcTable}
      <h2>Thanks</h2>
      <p>Thanks to the editors of English, Spanish and Russian Wikipedia who have kept the articles about gymnasts and their music for years, and to the contributors of MusicBrainz.</p>
      <p>Thanks to all the gymnastics fans in the RG Pirates chat who supported my project from the start.</p>
      <p>The music archive of the rgforum.no forum is planned as another source. When it is added, the people who collected it will be credited here.</p>
      <h2>Feedback</h2>
      <p>Found an error, know music that is missing, or have an idea for the site? Write to us through the form; no account is needed.</p>
      <p><a class="pill" style="text-decoration:none" href="${FEEDBACK_URL}" target="_blank" rel="noopener">Leave feedback</a></p>
      <h2>Code</h2>
      <p>The source code is on ${repo}. If you have a GitHub account, you can also report an error as an issue there.</p>
      <p class="muted">${supportHtml()}</p>
    </div>`;
  }
  const notFound = () => `<h1>${esc(t().notFound)}</h1><p><a href="#home" style="text-decoration:underline">${esc(t().back)}</a></p>`;

  // ---------- routing and events ----------
  function route() {
    const h = (location.hash || '#home').slice(1);
    const m = h.match(/^(gymnast|work|person)-(\d+)$/);
    const page = m ? m[1] : (['home', 'gymnasts', 'music', 'rankings', 'about'].includes(h) ? h : (h ? 'missing' : 'home'));
    const tab = { home: 'home', gymnasts: 'gymnasts', gymnast: 'gymnasts', music: 'music', work: 'music', person: 'music', rankings: 'rankings', about: 'about' }[page];
    document.getElementById('tabs').innerHTML = ['home', 'gymnasts', 'music', 'rankings', 'about'].map(k => `<a class="tab" href="#${k}"${k === tab ? ' aria-current="page"' : ''}>${bothKey(k)}</a>`).join('');
    document.documentElement.lang = lang;
    view.innerHTML = page === 'home' ? home() : page === 'gymnasts' ? gymnasts() : page === 'music' ? music() : page === 'rankings' ? rankings() : page === 'about' ? about()
      : page === 'gymnast' ? gymnast(+m[2]) : page === 'work' ? work(+m[2]) : page === 'person' ? person(+m[2]) : notFound();
    if (page === 'home') homeSearch();
    document.getElementById('foot').innerHTML = `<span>${esc(t().source)}</span><span>${esc(t().built)}: ${esc(D.built)}</span>${supportHtml()}`;
    document.title = 'RG Music Catalog';
    ['en', 'ru'].forEach(l => document.getElementById('lang-' + l).setAttribute('aria-pressed', String(lang === l)));
  }
  function rerender(focusId) {
    const el = focusId && document.getElementById(focusId), pos = el && el.selectionStart;
    route();
    const again = focusId && document.getElementById(focusId);
    if (again) { again.focus(); if (pos != null && again.setSelectionRange) again.setSelectionRange(pos, pos); }
  }
  view.addEventListener('input', e => {
    const id = e.target.id;
    if (id === 'q-home') { ui.home.q = e.target.value; homeSearch(); }
    if (id === 'q-gyms') { ui.gyms.q = e.target.value; rerender(id); }
    if (id === 'q-music') { ui.music.q = e.target.value; ui.music.shown = 60; rerender(id); }
  });
  view.addEventListener('change', e => {
    const id = e.target.id, v = e.target.value;
    if (id === 'c-gyms') ui.gyms.country = v;
    else if (id === 'd-gyms') ui.gyms.dec = +v;
    else if (id === 'g-music') { ui.music.kind = v; ui.music.shown = 60; }
    else if (id === 'a-music') { ui.music.app = +v; ui.music.shown = 60; }
    else if (id === 'd-music') { ui.music.dec = +v; ui.music.shown = 60; }
    else if (id === 's-music') { ui.music.sort = v; ui.music.shown = 60; }
    else if (id === 's-gyms') ui.gyms.sort = v;
    else if (id === 'd-rank') ui.rank.dec = +v;
    else if (id === 'a-rank') ui.rank.app = +v;
    else return;
    rerender(id);
  });
  view.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const h = (location.hash || '').match(/^#(gymnast|work)-(\d+)$/);
    if (b.dataset.year !== undefined && h) { ui.gym[+h[2]] = +b.dataset.year; route(); }
    else if (b.dataset.ex !== undefined) { ui.work.ex = +b.dataset.ex; route(); }
    else if (b.dataset.mode) { ui.rank.mode = b.dataset.mode; route(); }
    else if (b.dataset.only) { ui.gyms.music = !ui.gyms.music; route(); }
    else if (b.id === 'more-music') { ui.music.shown += 60; route(); }
  });
  window.addEventListener('hashchange', () => { ui.work.ex = -1; route(); window.scrollTo(0, 0); });
  ['en', 'ru'].forEach(l => document.getElementById('lang-' + l).addEventListener('click', () => {
    lang = l; try { localStorage.setItem('rg-lang', l); } catch (e) {} if (D) route();
  }));

  // index.html (GitHub Pages, a file opened from disk) carries the data inline; the claude.ai page reads data.json
  (window.RG_DATA ? Promise.resolve(window.RG_DATA) : fetch('data.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }))
    .then(d => { D = index(d); route(); })
    .catch(() => { view.innerHTML = '<p>The catalogue data could not be loaded (data.json). Reload the page to try again.</p>'; });
})();
</script>
</body>
</html>
