<title>RG Music Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one centred column, pill tabs on top; every apparatus keeps one colour across all views.
   One light look on purpose (direction D chosen by the owner); every colour is still set explicitly. */
:root { color-scheme: light;
  --bg: #FFFFFF; --fg: #1A1B1E; --muted: #5F6168; --line: #E3E4E8; --soft: #F1F2F4; --field: #F6F7F9;
  --ink: #1A1B1E; --on-ink: #FFFFFF; --link: #2F5BEA;
  --hoop: #2F5BEA; --ball: #E8833A; --clubs: #0E9F8E; --ribbon: #B24BD6; --rope: #8A8D96; --gala: #1A1B1E;
  --font: 'Manrope', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
}
/* Always keep room for the scrollbar: a longer Russian page must not shift the centred column sideways */
html { overflow-y: scroll; scrollbar-gutter: stable; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.45; }
a { color: inherit; text-decoration: none; }
a:hover { color: var(--link); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.wrap { max-width: 1200px; margin: 0 auto; padding-inline: 24px; padding-block: 0 64px; }
@media (max-width: 600px) { .wrap { padding-inline: 16px; } }
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; min-height: 76px; }
.logo { font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; background: var(--soft); border-radius: 24px; padding: 4px; }
.tab { font-size: 14px; font-weight: 600; min-height: 40px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 20px; color: var(--fg); }
.tab[aria-current="page"] { background: var(--ink); color: var(--on-ink); }
.lang { margin-left: auto; display: flex; background: var(--soft); border-radius: 22px; padding: 4px; }
.lang button { font: inherit; font-size: 13px; font-weight: 700; min-height: 36px; min-width: 44px; border: 0; border-radius: 18px; cursor: pointer; background: transparent; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--bg); color: var(--fg); }
h1 { font-size: clamp(34px, 5vw, 52px); font-weight: 800; letter-spacing: -.03em; line-height: 1.05; margin: 28px 0 8px; text-wrap: balance; }
h2 { font-size: 16px; font-weight: 700; margin: 0 0 12px; }
.muted { color: var(--muted); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.small { font-size: 13px; }
.sub { margin: 0 0 20px; color: var(--muted); }
.panel { border: 1px solid var(--line); border-radius: 16px; padding: 22px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 16px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); margin-block: 20px; }
.kpi b { display: block; font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; }
.search { width: 100%; box-sizing: border-box; font: inherit; font-size: 17px; min-height: 52px; padding: 0 20px; border: 1px solid var(--line); border-radius: 26px; background: var(--field); color: var(--fg); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-block: 16px 20px; }
.filters .search { flex: 1 1 260px; width: auto; min-height: 44px; font-size: 15px; }
.both { display: inline-grid; }
.both > span { grid-area: 1 / 1; text-align: center; }
.both > .ghost { visibility: hidden; }
/* Fixed widths: a native select grows to its longest option, and Russian country names are longer */
select.pill { width: 12.5em; flex: none; max-width: 100%; }
#c-gyms { width: 15em; }
.pill, select.pill { font: inherit; font-size: 14px; min-height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.bar { display: flex; gap: 3px; height: 8px; }
.bar span { border-radius: 4px; }
.card { display: block; border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; min-width: 0; }
.card:hover { border-color: var(--muted); color: inherit; }
.card .t { font-weight: 700; font-size: 16px; }
.yt { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--link); margin-top: 10px; min-height: 28px; }
.yt:hover { text-decoration: underline; }
.badge { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 10px; background: var(--soft); white-space: nowrap; }
.list-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.rank { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.meter { display: block; height: 4px; border-radius: 2px; background: var(--ink); margin-top: 6px; }
.num { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 10px 8px 10px 0; }
td { padding: 11px 8px 11px 0; border-top: 1px solid var(--line); vertical-align: top; }
.scroll { overflow-x: auto; }
.season h3 { font-size: 22px; font-weight: 800; margin: 28px 0 12px; }
.about { max-width: 760px; }
.about h2 { font-size: 20px; margin: 32px 0 10px; }
.about p, .about li { max-width: 68ch; }
.about ol, .about ul { padding-left: 1.3em; display: grid; gap: 8px; }
.about td:first-child { font-weight: 700; white-space: nowrap; }
.about a { text-decoration: underline; }
.routine { border-top-width: 4px; }
.app-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.timeline { display: grid; align-items: end; height: 110px; border-bottom: 1px solid var(--fg); min-width: 640px; }
.timeline div { display: flex; flex-direction: column-reverse; align-items: center; gap: 3px; padding-bottom: 6px; }
.timeline span { width: 11px; height: 11px; border-radius: 50%; }
.years { display: grid; min-width: 640px; margin-top: 6px; }
.years span { font-size: 11px; text-align: center; color: var(--muted); }
.chart { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 8px; align-items: end; height: 220px; }
.chart div { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; font-size: 12px; font-weight: 700; }
.chart i { width: 100%; border-radius: 6px 6px 0 0; background: var(--ink); margin-top: 4px; }
.chart-x { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 8px; margin-top: 6px; font-size: 10px; text-align: center; color: var(--muted); }
.results { display: grid; gap: 4px; margin-top: 10px; }
.results a { padding: 8px 12px; border-radius: 10px; background: var(--soft); }
.more { margin-top: 16px; }
footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 24px; }
footer a { text-decoration: underline; }
@media (prefers-reduced-motion: no-preference) { .card, .pill { transition: border-color .15s, background .15s; } }
</style>

<div class="wrap">
  <header class="top">
    <a class="logo" href="#home">RG Music</a>
    <nav class="tabs" id="tabs" aria-label="Main"></nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-en" aria-pressed="true">EN</button>
      <button type="button" id="lang-ru" aria-pressed="false">RU</button>
    </div>
  </header>
  <main id="view"><p class="muted">Loading the catalogue…</p></main>
  <footer id="foot"></footer>
</div>

<script>
(() => {
  const T = {
    en: { home: 'Home', gymnasts: 'Gymnasts', music: 'Music', rankings: 'Rankings', about: 'About', h1: 'What rhythmic gymnasts perform to',
      search: 'Search gymnasts and music', searchMusic: 'Title, composer or performer', searchName: 'Name, in Latin or Cyrillic',
      gymWithMusic: 'gymnasts with known music', allGyms: 'gymnasts from the World Championships', onlyMusic: 'Only with known music',
      wc: 'World Championships', musicUnknown: 'Music not known yet', noMusicNote: 'Her Wikipedia article has no information about her music yet.',
      noArticle: 'There is no Wikipedia article about her yet; she is known from World Championship results.', works: 'works', routines: 'routines with known music', seasons: 'seasons',
      byApp: 'Routines by apparatus', top: 'Most used music', topNote: 'Number = gymnasts; bar = routines by apparatus',
      share: 'Classical share of routines', shareNote: 'Five-year periods; the last one is not finished.',
      allCountries: 'All countries', allDecades: 'All decades', allApp: 'All apparatus', all: 'All', more: 'Show more',
      gym: 'gymnasts', rou: 'routines', ver: 'versions', recNotStated: 'Recording not stated', noExcerpt: '—',
      season: 'Season', apparatus: 'Apparatus', gymnast: 'Gymnast', excerpt: 'Excerpt', recording: 'Recording',
      bySeason: 'Routines by season', versions: 'Versions', excerpts: 'Excerpts', fromWiki: 'Wikipedia article',
      countBy: 'Count by', byGym: 'By gymnasts', byRou: 'By routines',
      exG: 'How many different gymnasts chose it.', exR: 'How often it was heard: every routine counts, so the same music on another apparatus or in another season counts again.',
      boards: [['Music', 'Works'], ['Performers', 'Whose version the gymnast uses'], ['Composers', 'Classical, jazz, tango, film, musical'], ['Films', 'Music written for a film, musical or game']],
      kpiG: 'gymnasts', kpiR: 'routines', kpiV: 'versions', findYt: 'Find on YouTube', video: 'Video', kinds: { classical: 'Classical', song: 'Song', film: 'Film', folk: 'Folk', other: 'Other' }, songAuthor: n => `song · ${n} version${n === 1 ? '' : 's'}`,
      vt: { original: 'original', cover: 'cover', remix: 'remix', medley: 'medley', cast: 'cast', instrumental: 'instrumental', arrangement: 'arrangement', unknown: '' },
      found: 'Found', nothing: 'Nothing found.', notFound: 'This page does not exist.', back: 'Back to home', events: 'Performed at',
      source: 'Data: English Wikipedia, with gaps filled from Spanish and Russian Wikipedia (CC BY-SA 4.0), and MusicBrainz (CC0). Music identified and reviewed by hand; Russian names in progress.', built: 'Built',
      support: 'Support the project', supportSoon: 'Support the project: donations via PayPal are coming soon.',
      supportNote: 'I build this catalogue on my own, in my free time. If it was useful to you, you can support it.' },
    ru: { home: 'Главная', gymnasts: 'Гимнастки', music: 'Музыка', rankings: 'Рейтинги', about: 'О проекте', h1: 'Под какую музыку выступают гимнастки',
      search: 'Поиск гимнасток и музыки', searchMusic: 'Название, композитор или исполнитель', searchName: 'Имя латиницей или кириллицей',
      gymWithMusic: 'гимнасток с известной музыкой', allGyms: 'гимнасток с чемпионатов мира', onlyMusic: 'Только с известной музыкой',
      wc: 'Чемпионаты мира', musicUnknown: 'Музыка пока неизвестна', noMusicNote: 'В статье Википедии о ней пока нет сведений о музыке.',
      noArticle: 'Статьи в Википедии о ней пока нет; она известна по результатам чемпионатов мира.', works: 'произведений', routines: 'программ с известной музыкой', seasons: 'сезоны',
      byApp: 'Программы по предметам', top: 'Самая популярная музыка', topNote: 'Число — гимнастки; полоска — программы по предметам',
      share: 'Доля классики в программах', shareNote: 'Пятилетия; последнее ещё не закончилось.',
      allCountries: 'Все страны', allDecades: 'Все десятилетия', allApp: 'Все предметы', all: 'Все', more: 'Показать ещё',
      gym: 'гимн.', rou: 'прогр.', ver: 'версий', recNotStated: 'Запись не указана', noExcerpt: '—',
      season: 'Сезон', apparatus: 'Предмет', gymnast: 'Гимнастка', excerpt: 'Фрагмент', recording: 'Запись',
      bySeason: 'Программы по сезонам', versions: 'Версии', excerpts: 'Фрагменты', fromWiki: 'Статья в Википедии',
      countBy: 'Считать по', byGym: 'По гимнасткам', byRou: 'По программам',
      exG: 'Сколько разных гимнасток выбрали эту музыку.', exR: 'Как часто она звучала: считается каждая программа — та же музыка на другом предмете или в следующем сезоне засчитывается ещё раз.',
      boards: [['Музыка', 'Произведения'], ['Исполнители', 'Чью версию использует гимнастка'], ['Композиторы', 'Классика, джаз, танго, кино, мюзиклы'], ['Фильмы', 'Музыка, написанная для фильма, мюзикла или игры']],
      kpiG: 'гимнасток', kpiR: 'программ', kpiV: 'версий', findYt: 'Найти на YouTube', video: 'Видео', kinds: { classical: 'Классика', song: 'Песня', film: 'Кино', folk: 'Народная', other: 'Другое' }, songAuthor: n => `песня · версий: ${n}`,
      vt: { original: 'оригинал', cover: 'кавер', remix: 'ремикс', medley: 'попурри', cast: 'актёры', instrumental: 'инструментал', arrangement: 'аранжировка', unknown: '' },
      found: 'Найдено', nothing: 'Ничего не найдено.', notFound: 'Такой страницы нет.', back: 'На главную', events: 'Выступления',
      source: 'Данные: английская Википедия, пробелы дополнены из испанской и русской (CC BY-SA 4.0), и MusicBrainz (CC0). Музыка сопоставлена и проверена вручную; русские названия дополняются.', built: 'Собрано',
      support: 'Поддержать проект', supportSoon: 'Поддержать проект: скоро можно будет через PayPal.',
      supportNote: 'Я делаю этот каталог сама, в свободное время. Если он вам пригодился, его можно поддержать.' }
  };
  // The PayPal "Donate" link (paypal.com/donate/?hosted_button_id=...). Empty until the account is verified: the page
  // then says donations are coming soon; once set, the same places show a "Support the project" link.
  const SUPPORT_URL = '';
  const supportHtml = () => SUPPORT_URL
    ? `<a class="yt" style="margin:0" href="${esc(SUPPORT_URL)}" target="_blank" rel="noopener">${esc(t().support)} · PayPal</a>`
    : `<span>${esc(t().supportSoon)}</span>`;
  const APP_COLOR = ['--hoop', '--ball', '--clubs', '--ribbon', '--rope', '--gala', '--rope'];
  const view = document.getElementById('view');
  let D = null, lang = 'en';
  try { lang = localStorage.getItem('rg-lang') === 'ru' ? 'ru' : 'en'; } catch (e) {}
  const ui = { gym: {}, music: { kind: '', app: -1, dec: 0, q: '', shown: 60 }, gyms: { q: '', country: '', dec: 0, music: false }, rank: { mode: 'gymnasts', dec: 0, app: -1 }, work: { ex: -1 }, home: { q: '' } };

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fold = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const t = () => T[lang];
  // A label holding both languages in one grid cell: its width is the longer one, so switching language moves nothing
  const both = (en, ruText) => `<span class="both"><span${lang === 'en' ? '' : ' class="ghost" aria-hidden="true"'}>${esc(en)}</span><span${lang === 'ru' ? '' : ' class="ghost" aria-hidden="true"'}>${esc(ruText)}</span></span>`;
  const bothKey = (k, sub) => sub ? both(T.en[sub][k], T.ru[sub][k]) : both(T.en[k], T.ru[k]);
  const ru = () => lang === 'ru';
  const color = a => `var(${APP_COLOR[a] || '--rope'})`;
  const fmt = n => n.toLocaleString(ru() ? 'ru-RU' : 'en-US');

  // ---------- data and indexes ----------
  function index(d) {
    d.gymRoutines = d.gymnasts.map(() => []);
    d.workRoutines = d.works.map(() => new Set());
    d.workTracks = d.works.map(() => []);
    d.versionRoutines = d.versions.map(() => new Set());
    d.routines.forEach((r, i) => {
      d.gymRoutines[r[0]].push(i);
      r[5].forEach(([v, e, title]) => {
        const w = d.versions[v][0];
        d.workRoutines[w].add(i); d.workTracks[w].push([i, v, e, title]); d.versionRoutines[v].add(i);
      });
    });
    d.workStats = d.works.map((w, i) => {
      const rs = [...d.workRoutines[i]], gs = new Set(rs.map(r => d.routines[r][0]));
      const split = {}; rs.forEach(r => { const a = d.routines[r][2]; split[a] = (split[a] || 0) + 1; });
      const ys = rs.map(r => d.routines[r][1]).filter(Boolean);
      return { g: gs.size, n: rs.length, split, y0: Math.min(...ys), y1: Math.max(...ys), versions: new Set(d.workTracks[i].map(x => x[1])).size };
    });
    d.order = d.works.map((_, i) => i).sort((a, b) => d.workStats[b].g - d.workStats[a].g || d.workStats[b].n - d.workStats[a].n);
    return d;
  }
  const gName = i => { const g = D.gymnasts[i]; return ru() && g[1] ? g[1] : g[0]; };
  const gOther = i => { const g = D.gymnasts[i]; return ru() ? (g[1] ? g[0] : '') : g[1]; };
  const country = c => { const x = D.countries[c]; return x ? (ru() && x[1] ? x[1] : x[0]) : ''; };
  const appName = a => { const x = D.apparatus[a]; return x ? (ru() && x[1] ? x[1] : x[0]) : ''; };
  const wName = i => { const w = D.works[i]; return ru() && w[1] ? w[1] : w[0]; };
  const wAuthor = i => { const w = D.works[i]; if (w[4] === 'performer' || !w[2]) return t().songAuthor(D.workStats[i].versions); return ru() && w[3] ? w[3] : w[2]; };
  const splitBar = split => `<span class="bar" aria-hidden="true">${Object.keys(split).sort((a, b) => a - b).map(a => `<span style="flex:${split[a]} 1 0;background:${color(+a)}"></span>`).join('')}</span>`;
  const decadeOk = (y, dec) => !dec || (y >= dec && y < dec + 10);
  const decades = () => [1990, 2000, 2010, 2020];
  const decLabel = d => ru() ? `${d}-е` : `${d}s`;

  // ---------- pages ----------
  function home() {
    const s = t(), total = D.routines.length, apps = {};
    D.routines.forEach(r => { if (r[2] >= 0 && r[2] <= 4) apps[r[2]] = (apps[r[2]] || 0) + 1; });
    const ys = D.routines.map(r => r[1]).filter(Boolean);
    const periods = [];
    for (let p = 1990; p <= 2025; p += 5) {
      const rs = D.routines.filter(r => r[1] >= p && r[1] < p + 5);
      if (rs.length < 20) continue;
      const c = rs.filter(r => r[5].some(([v]) => D.works[D.versions[v][0]][5] === 'classical')).length;
      periods.push([p === 2025 ? '2025–' : `${p}–${String(p + 4).slice(2)}`, Math.round(c / rs.length * 100)]);
    }
    const maxP = Math.max(...periods.map(p => p[1]));
    return `<h1>${esc(s.h1)}</h1>
      <label for="q-home" class="vh">${esc(s.search)}</label>
      <input id="q-home" class="search" type="search" placeholder="${esc(s.search)}" value="${esc(ui.home.q)}" autocomplete="off">
      <div id="home-results" class="results"></div>
      <div class="kpis">
        <div class="panel kpi"><b>${D.gymRoutines.filter(rs => rs.length).length}</b><span class="muted">${esc(s.gymWithMusic)}</span></div>
        <div class="panel kpi"><b>${fmt(D.works.length)}</b><span class="muted">${esc(s.works)}</span></div>
        <div class="panel kpi"><b>${fmt(total)}</b><span class="muted">${esc(s.routines)}</span></div>
        <div class="panel kpi"><b>${Math.min(...ys)}–${Math.max(...ys)}</b><span class="muted">${esc(s.seasons)}</span></div>
      </div>
      <section class="panel"><h2>${esc(s.byApp)}</h2>
        <div class="bar" style="height:16px" role="img" aria-label="${esc(s.byApp)}">${[0, 1, 2, 3, 4].map(a => `<span style="flex:${apps[a] || 0} 1 0;background:${color(a)}"></span>`).join('')}</div>
        <div class="row small" style="margin-top:12px">${[0, 1, 2, 3, 4].map(a => `<span style="display:flex;align-items:center;gap:6px"><span class="dot" style="background:${color(a)}"></span>${esc(appName(a))} <span class="muted">${fmt(apps[a] || 0)}</span></span>`).join('')}</div>
      </section>
      <div class="row" style="margin-top:16px">
        <section class="panel" style="flex:1.4 1 480px"><h2>${esc(s.top)}</h2>
          ${D.order.slice(0, 10).map(i => `<div class="list-row" style="grid-template-columns:minmax(0,1fr) minmax(80px,160px) 32px">
            <div><a href="#work-${i}" style="font-weight:700">${esc(wName(i))}</a><div class="muted small">${esc(wAuthor(i))}</div></div>
            ${splitBar(D.workStats[i].split)}<span class="num">${D.workStats[i].g}</span></div>`).join('')}
          <p class="muted small" style="margin:10px 0 0">${esc(s.topNote)}</p>
        </section>
        <section class="panel" style="flex:1 1 340px"><h2>${esc(s.share)}</h2>
          <div class="chart" style="--n:${periods.length}" role="img" aria-label="${esc(s.share)}: ${periods.map(p => p[0] + ' ' + p[1] + '%').join(', ')}">

  function homeSearch() {

  const wcLine = i => { const ys = D.gymnasts[i][4]; return ys.length ? `${t().wc}: ${ys.length > 1 ? ys[0] + '–' + ys[ys.length - 1] : ys[0]} (${ys.length})` : ''; };
  function gymnasts() {

  // A YouTube search for one routine: gymnast, apparatus, season and music, in the page language (videos of Russian

  const ytIcon = '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.5v9l7.5-4.5z" fill="currentColor"/></svg>';
  function ytUrl(r) {
    const R = D.routines[r], first = R[5][0];

  function trackLine(v, e, title) {

    return `<div style="margin-top:6px"><a href="#work-${w}" style="font-weight:700">${esc(name)}</a>${extra ? `<div class="small">${esc(extra)}</div>` : ''}<div class="muted small">${esc(by)}</div></div>`;
  }
  function gymnast(i) {
    const s = t(), g = D.gymnasts[i]; if (!g) return notFound();
    const rs = D.gymRoutines[i], years = [...new Set(rs.map(r => D.routines[r][1]))].sort((a, b) => b - a);

  function work(i) {

    const st = D.workStats[i], ex = ui.work.ex;
    const tracks = D.workTracks[i].filter(x => ex < 0 || x[2] === ex);
    const exCount = {}; D.workTracks[i].forEach(x => { if (x[2] >= 0) exCount[x[2]] = (exCount[x[2]] || 0) + 1; });

        </tbody></table></div></section>

  function rankings() {
    const s = t(), f = ui.rank, R = f.mode === 'routines';

    D.routines.forEach((Ro, r) => {

              <span class="num">${main}<span class="muted small" style="display:block;font-weight:400">${other} ${esc(R ? s.gym : s.rou)}</span></span></div>`; }).join('') || `<p class="muted">${esc(s.nothing)}</p>`}</section>`;

  // ---------- about ----------
  const REPO = 'https://github.com/BorisenkoAnna1193/rg-music-catalog';
  // Feedback for people without a GitHub account: the owner's Google Form (answers go to a sheet in her Drive)
  const FEEDBACK_URL = 'https://docs.google.com/forms/d/e/1FAIpQLScq1FhLCI8a63MFW8fCViEwgiU_PU3q8xgP8rjhcUH5ZPCELw/viewform';
  function about() {
    const gyms = D.gymnasts.length, withMusic = D.gymRoutines.filter(rs => rs.length).length;
    const ys = D.routines.map(r => r[1]).filter(Boolean), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const wcYears = D.gymnasts.flatMap(g => g[4]), wc0 = Math.min(...wcYears), wc1 = Math.max(...wcYears);
    const n = { gyms: fmt(gyms), withMusic: fmt(withMusic), routines: fmt(D.routines.length), works: fmt(D.works.length), versions: fmt(D.versions.length) };
    const src = ru() ? [
      ['Википедия на английском', 'Список гимнасток (таблицы чемпионатов мира), музыка из статей о гимнастках', 'CC BY-SA 4.0', 'https://en.wikipedia.org'],
      ['Википедия на испанском и русском', 'Музыка гимнасток, у которых её нет в английской статье; испанские тексты переведены на английский и проверены вручную', 'CC BY-SA 4.0', 'https://es.wikipedia.org'],
      ['Викиданные', 'Имена гимнасток на русском, идентификаторы World Gymnastics', 'CC0', 'https://www.wikidata.org'],
      ['Профили спортсменок World Gymnastics (бывшая FIG)', 'Официальное написание имени, когда в таблицах оно разное', '', 'https://www.gymnastics.sport'],
      ['MusicBrainz', 'Доказательства, что две записи — одно произведение; авторы произведений', 'CC0', 'https://musicbrainz.org'],
      ['ISO 3166', 'Коды и названия стран', '', ''],
      ['YouTube', 'Только ссылки на поиск видео; с YouTube ничего не загружается', '', ''],
    ] : [
      ['English Wikipedia', 'The list of gymnasts (World Championship tables) and the music in gymnasts’ articles', 'CC BY-SA 4.0', 'https://en.wikipedia.org'],
      ['Spanish and Russian Wikipedia', 'Music of gymnasts whose English article has none; Spanish text translated into English and checked by hand', 'CC BY-SA 4.0', 'https://es.wikipedia.org'],
      ['Wikidata', 'Gymnasts’ names in Russian, World Gymnastics identifiers', 'CC0', 'https://www.wikidata.org'],
      ['World Gymnastics athlete profiles (formerly FIG)', 'The official spelling of a name when the tables disagree', '', 'https://www.gymnastics.sport'],
      ['MusicBrainz', 'Evidence that two recordings are the same work; authors of works', 'CC0', 'https://musicbrainz.org'],
      ['ISO 3166', 'Country codes and names', '', ''],
      ['YouTube', 'Search links only; nothing is loaded from YouTube', '', ''],
    ];
    const srcTable = `<div class="scroll"><table><thead><tr><th>${ru() ? 'Источник' : 'Source'}</th><th>${ru() ? 'Для чего' : 'Used for'}</th><th>${ru() ? 'Лицензия' : 'Licence'}</th></tr></thead><tbody>
      ${src.map(([name, use, lic, url]) => `<tr><td>${url ? `<a href="${url}" target="_blank" rel="noopener">${esc(name)}</a>` : esc(name)}</td><td>${esc(use)}</td><td class="muted">${esc(lic || '—')}</td></tr>`).join('')}</tbody></table></div>`;
    const repo = `<a href="${REPO}" target="_blank" rel="noopener">GitHub</a>`;
    return ru() ? `<div class="about">
      <h1>О проекте</h1>
      <p class="sub">Каталог музыки, под которую выступают гимнастки в художественной гимнастике.</p>
      <p>Это любительский проект от большой фанатки художественной гимнастики, который отражает не только её любовь к этому виду спорта, но и к цифрам, статистике и рейтингам.</p>
      <p>Он отвечает на два вопроса: под какую музыку выступала гимнастка — по сезонам и предметам. И наоборот: для каждого когда-либо использованного в спорте музыкального произведения можно посмотреть, кто его выбирал, в каком году и под какой предмет.</p>
      <p>Сейчас в каталоге ${n.gyms} гимнасток с чемпионатов мира ${wc0}–${wc1}, у ${n.withMusic} из них известна музыка: ${n.routines} программ ${y0}–${y1} годов, ${n.works} произведений и ${n.versions} версий в исполнении разных музыкантов.</p>
      <h2>Как он сделан</h2>
      <ol>
        <li><b>Гимнастки.</b> Все участницы индивидуальных соревнований чемпионатов мира с ${wc0} года, по таблицам Википедии. Если имя записано по-разному, берётся написание из профиля спортсменки на сайте World Gymnastics.</li>
        <li><b>Музыка.</b> Таблицы «Год / Предмет / Музыка» из статей о гимнастках в английской Википедии. Для испанских гимнасток добавлены таблицы из испанской Википедии: они переведены на английский и проверены вручную. Английская статья остаётся главной, другие только дополняют её.</li>
        <li><b>Произведения и версии.</b> Одна и та же музыка записана в статьях по-разному. Треки собираются в произведения; одинаковое название с разными авторами остаётся раздельным, пока нет доказательства, что это одно произведение (MusicBrainz или ручная проверка). Исполнитель указан так, как в источнике.</li>
        <li><b>Ручная проверка.</b> Спорные случаи — одинаковые названия у разных песен, расхождения между источниками, переводы — проверены вручную, решения хранятся отдельно от исходных данных.</li>
      </ol>
      <h2>Источники данных</h2>
      ${srcTable}
      <h2>Благодарности</h2>
      <p>Спасибо редакторам Википедии на английском, испанском и русском, которые годами ведут статьи о гимнастках и их музыке, и участникам MusicBrainz.</p>
      <p>Спасибо всем фанатам гимнастики из чата RG Pirates, которые поддержали моё начинание.</p>
      <p>В планах — архив музыки с форума rgforum.no. Когда он будет подключён, здесь появится благодарность людям, которые его собирали.</p>
      <h2>Обратная связь</h2>
      <p>Нашли ошибку, знаете музыку, которой нет в каталоге, или есть идея для сайта? Напишите в форме — аккаунт не нужен. Форма на английском, но отвечать можно по-русски.</p>
      <p><a class="pill" style="text-decoration:none" href="${FEEDBACK_URL}" target="_blank" rel="noopener">Оставить отзыв</a></p>
      <h2>Код</h2>
      <p>Исходный код открыт на ${repo}. Если у вас есть аккаунт GitHub, ошибку можно описать и в разделе Issues.</p>
      <p class="muted">${supportHtml()}</p>
    </div>` : `<div class="about">
      <h1>About</h1>
      <p class="sub">A catalogue of the music rhythmic gymnasts perform to.</p>
      <p>This is an amateur project by a big fan of rhythmic gymnastics. It reflects her love not only for the sport but also for numbers, statistics and rankings.</p>
      <p>It answers two questions: what a gymnast performed to, by season and apparatus. And the other way round: for every piece of music ever used in the sport, you can see who chose it, in which year and for which apparatus.</p>
      <p>The catalogue holds ${n.gyms} gymnasts from the World Championships ${wc0}–${wc1}. Music is known for ${n.withMusic} of them: ${n.routines} routines from ${y0}–${y1}, ${n.works} works and ${n.versions} versions by different performers.</p>
      <h2>How it is made</h2>
      <ol>
        <li><b>Gymnasts.</b> Everyone in the individual events of the World Championships since ${wc0}, from the Wikipedia result tables. When a name is spelled in different ways, the spelling of the athlete’s World Gymnastics profile is used.</li>
        <li><b>Music.</b> The “Year / Apparatus / Music” tables in gymnasts’ English Wikipedia articles. For Spanish gymnasts, the tables of the Spanish Wikipedia are added, translated into English and checked by hand. The English article stays the main source; the others only fill its gaps.</li>
        <li><b>Works and versions.</b> The same music is written down in many ways. Tracks are grouped into works; one title with different authors stays split until there is evidence that it is one work (MusicBrainz or a manual check). The performer is shown as the source gives it.</li>
        <li><b>Manual review.</b> Doubtful cases, such as one title for different songs, conflicts between sources and translations, are checked by hand, and the decisions are kept apart from the source data.</li>
      </ol>
      <h2>Data sources</h2>
      ${srcTable}
      <h2>Thanks</h2>
      <p>Thanks to the editors of English, Spanish and Russian Wikipedia who have kept the articles about gymnasts and their music for years, and to the contributors of MusicBrainz.</p>
      <p>Thanks to all the gymnastics fans in the RG Pirates chat who supported my project from the start.</p>
      <p>The music archive of the rgforum.no forum is planned as another source. When it is added, the people who collected it will be credited here.</p>
      <h2>Feedback</h2>
      <p>Found an error, know music that is missing, or have an idea for the site? Write to us through the form; no account is needed.</p>
      <p><a class="pill" style="text-decoration:none" href="${FEEDBACK_URL}" target="_blank" rel="noopener">Leave feedback</a></p>
      <h2>Code</h2>
      <p>The source code is on ${repo}. If you have a GitHub account, you can also report an error as an issue there.</p>
      <p class="muted">${supportHtml()}</p>
    </div>`;
  }
  const notFound = () => `<h1>${esc(t().notFound)}</h1><p><a href="#home" style="text-decoration:underline">${esc(t().back)}</a></p>`;

  // ---------- routing and events ----------
  function route() {
    const h = (location.hash || '#home').slice(1);
    const m = h.match(/^(gymnast|work)-(\d+)$/);
    const page = m ? m[1] : (['home', 'gymnasts', 'music', 'rankings', 'about'].includes(h) ? h : (h ? 'missing' : 'home'));
    const tab = { home: 'home', gymnasts: 'gymnasts', gymnast: 'gymnasts', music: 'music', work: 'music', rankings: 'rankings', about: 'about' }[page];
    document.getElementById('tabs').innerHTML = ['home', 'gymnasts', 'music', 'rankings', 'about'].map(k => `<a class="tab" href="#${k}"${k === tab ? ' aria-current="page"' : ''}>${bothKey(k)}</a>`).join('');
    document.documentElement.lang = lang;
    view.innerHTML = page === 'home' ? home() : page === 'gymnasts' ? gymnasts() : page === 'music' ? music() : page === 'rankings' ? rankings() : page === 'about' ? about()
      : page === 'gymnast' ? gymnast(+m[2]) : page === 'work' ? work(+m[2]) : notFound();
    if (page === 'home') homeSearch();
    document.getElementById('foot').innerHTML = `<span>${esc(t().source)}</span><span>${esc(t().built)}: ${esc(D.built)}</span>${supportHtml()}`;
    document.title = 'RG Music Catalog';
    ['en', 'ru'].forEach(l => document.getElementById('lang-' + l).setAttribute('aria-pressed', String(lang === l)));
  }
  function rerender(focusId) {
    const el = focusId && document.getElementById(focusId), pos = el && el.selectionStart;
    route();
    const again = focusId && document.getElementById(focusId);
    if (again) { again.focus(); if (pos != null && again.setSelectionRange) again.setSelectionRange(pos, pos); }
  }
  view.addEventListener('input', e => {
    const id = e.target.id;
    if (id === 'q-home') { ui.home.q = e.target.value; homeSearch(); }
    if (id === 'q-gyms') { ui.gyms.q = e.target.value; rerender(id); }
    if (id === 'q-music') { ui.music.q = e.target.value; ui.music.shown = 60; rerender(id); }
  });
  view.addEventListener('change', e => {
    const id = e.target.id, v = e.target.value;
    if (id === 'c-gyms') ui.gyms.country = v;
    else if (id === 'd-gyms') ui.gyms.dec = +v;
    else if (id === 'a-music') { ui.music.app = +v; ui.music.shown = 60; }
    else if (id === 'd-music') { ui.music.dec = +v; ui.music.shown = 60; }
    else if (id === 'd-rank') ui.rank.dec = +v;
    else if (id === 'a-rank') ui.rank.app = +v;
    else return;
    rerender(id);
  });
  view.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const h = (location.hash || '').match(/^#(gymnast|work)-(\d+)$/);
    if (b.dataset.year !== undefined && h) { ui.gym[+h[2]] = +b.dataset.year; route(); }
    else if (b.dataset.kind !== undefined) { ui.music.kind = b.dataset.kind; ui.music.shown = 60; route(); }
    else if (b.dataset.ex !== undefined) { ui.work.ex = +b.dataset.ex; route(); }
    else if (b.dataset.mode) { ui.rank.mode = b.dataset.mode; route(); }
    else if (b.dataset.only) { ui.gyms.music = !ui.gyms.music; route(); }
    else if (b.id === 'more-music') { ui.music.shown += 60; route(); }
  });
  window.addEventListener('hashchange', () => { ui.work.ex = -1; route(); window.scrollTo(0, 0); });
  ['en', 'ru'].forEach(l => document.getElementById('lang-' + l).addEventListener('click', () => {
    lang = l; try { localStorage.setItem('rg-lang', l); } catch (e) {} if (D) route();
  }));

  // index.html (GitHub Pages, a file opened from disk) carries the data inline; the claude.ai page reads data.json
  (window.RG_DATA ? Promise.resolve(window.RG_DATA) : fetch('data.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }))
    .then(d => { D = index(d); route(); })
    .catch(() => { view.innerHTML = '<p>The catalogue data could not be loaded (data.json). Reload the page to try again.</p>'; });
})();
</script>
